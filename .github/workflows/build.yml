name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Android Project and Compile APK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q gradle.zip
          export PATH="$PWD/gradle-8.7/bin:$PATH"
          mkdir -p android-project/app/src/main/assets
          mkdir -p android-project/app/src/main/java/com/stark/jarvis
          cp index.html android-project/app/src/main/assets/index.html
          echo "org.gradle.jvmargs=-Xmx2048m" > android-project/gradle.properties
          cat << 'EOF' > android-project/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JARVIS"
          include ':app'
          EOF
          cat << 'EOF' > android-project/build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
          }
          EOF
          cat << 'EOF' > android-project/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.stark.jarvis'
              compileSdk 34
              defaultConfig {
                  applicationId "com.stark.jarvis"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
          }
          EOF
          cat << 'EOF' > android-project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="com.android.alarm.permission.SET_ALARM" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>
              <application
                  android:label="J.A.R.V.I.S."
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat << 'EOF' > android-project/app/src/main/java/com/stark/jarvis/MainActivity.java
          package com.stark.jarvis;
          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.AlarmClock;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private WebView webView;
              private TextToSpeech tts;
              private SpeechRecognizer speechRecognizer;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 101);
                  }

                  tts = new TextToSpeech(this, status -> {
                      if (status == TextToSpeech.SUCCESS) {
                          tts.setLanguage(new Locale("tr", "TR"));
                          tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                              @Override public void onStart(String utteranceId) {}
                              @Override public void onDone(String utteranceId) {
                                  runOnUiThread(() -> webView.evaluateJavascript("if(window.onNativeTtsDone) window.onNativeTtsDone();", null));
                              }
                              @Override public void onError(String utteranceId) {
                                  runOnUiThread(() -> webView.evaluateJavascript("if(window.onNativeTtsDone) window.onNativeTtsDone();", null));
                              }
                          });
                      }
                  });

                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);

                  webView.addJavascriptInterface(new AndroidBridge(), "AndroidBridge");
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          request.grant(request.getResources());
                      }
                  });
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url.startsWith("http://") || url.startsWith("https://")) {
                              return false;
                          }
                          launchExternal(url, "");
                          return true;
                      }
                  });

                  try {
                      InputStream is = getAssets().open("index.html");
                      ByteArrayOutputStream buffer = new ByteArrayOutputStream();
                      int nRead;
                      byte[] data = new byte[4096];
                      while ((nRead = is.read(data, 0, data.length)) != -1) {
                          buffer.write(data, 0, nRead);
                      }
                      is.close();
                      String html = new String(buffer.toByteArray(), StandardCharsets.UTF_8);
                      webView.loadDataWithBaseURL("https://jarvis.stark.os/", html, "text/html", "UTF-8", null);
                  } catch (Exception e) {
                      webView.loadUrl("file:///android_asset/index.html");
                  }
              }

              private void launchExternal(String uri, String pkg) {
                  try {
                      if (pkg != null && !pkg.isEmpty()) {
                          Intent launchIntent = getPackageManager().getLaunchIntentForPackage(pkg);
                          if (launchIntent != null) {
                              launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(launchIntent);
                              return;
                          }
                      }
                      if (uri != null && !uri.isEmpty()) {
                          Intent i = uri.startsWith("intent:")
                              ? Intent.parseUri(uri, Intent.URI_INTENT_SCHEME)
                              : new Intent(Intent.ACTION_VIEW, Uri.parse(uri));
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(i);
                      }
                  } catch (Exception e) {}
              }

              public class AndroidBridge {
                  @JavascriptInterface
                  public void speak(String text, float rate, float pitch) {
                      if (tts != null) {
                          tts.setSpeechRate(rate);
                          tts.setPitch(pitch);
                          Bundle params = new Bundle();
                          tts.speak(text, TextToSpeech.QUEUE_FLUSH, params, "JARVIS_UTTERANCE");
                      }
                  }

                  @JavascriptInterface
                  public void stopSpeaking() {
                      if (tts != null) {
                          tts.stop();
                      }
                  }

                  @JavascriptInterface
                  public void openAppOrUri(String uri, String pkg) {
                      runOnUiThread(() -> launchExternal(uri, pkg));
                  }

                  @JavascriptInterface
                  public void setSystemAlarm(int hour, int minute) {
                      runOnUiThread(() -> {
                          try {
                              Intent i = new Intent(AlarmClock.ACTION_SET_ALARM);
                              i.putExtra(AlarmClock.EXTRA_HOUR, hour);
                              i.putExtra(AlarmClock.EXTRA_MINUTES, minute);
                              i.putExtra(AlarmClock.EXTRA_MESSAGE, "J.A.R.V.I.S. Alarm");
                              i.putExtra(AlarmClock.EXTRA_SKIP_UI, true);
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(i);
                          } catch (Exception e) {}
                      });
                  }

                  @JavascriptInterface
                  public void startListening() {
                      runOnUiThread(() -> {
                          try {
                              if (speechRecognizer == null) {
                                  speechRecognizer = SpeechRecognizer.createSpeechRecognizer(MainActivity.this);
                                  speechRecognizer.setRecognitionListener(new RecognitionListener() {
                                      @Override public void onReadyForSpeech(Bundle params) {}
                                      @Override public void onBeginningOfSpeech() {}
                                      @Override public void onRmsChanged(float rmsdB) {}
                                      @Override public void onBufferReceived(byte[] buffer) {}
                                      @Override public void onEndOfSpeech() {}
                                      @Override public void onError(int error) {
                                          launchVoiceDialogFallback();
                                      }
                                      @Override public void onResults(Bundle results) {
                                          ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                                          if (matches != null && !matches.isEmpty()) {
                                              String text = matches.get(0).replace("\\", "\\\\").replace("'", "\\'").replace("\n", " ");
                                              webView.evaluateJavascript("if(window.onNativeSpeechResult) window.onNativeSpeechResult('" + text + "');", null);
                                          }
                                      }
                                      @Override public void onPartialResults(Bundle partialResults) {
                                          ArrayList<String> matches = partialResults.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                                          if (matches != null && !matches.isEmpty()) {
                                              String text = matches.get(0).replace("\\", "\\\\").replace("'", "\\'").replace("\n", " ");
                                              webView.evaluateJavascript("if(window.onNativeSpeechPartial) window.onNativeSpeechPartial('" + text + "');", null);
                                          }
                                      }
                                      @Override public void onEvent(int eventType, Bundle params) {}
                                  });
                              }
                              Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                              intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                              intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "tr-TR");
                              intent.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
                              speechRecognizer.startListening(intent);
                          } catch (Exception e) {
                              launchVoiceDialogFallback();
                          }
                      });
                  }
              }

              private void launchVoiceDialogFallback() {
                  try {
                      Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                      intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                      intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "tr-TR");
                      intent.putExtra(RecognizerIntent.EXTRA_PROMPT, "J.A.R.V.I.S. Sizi Dinliyor...");
                      startActivityForResult(intent, 202);
                  } catch (Exception ex) {
                      webView.evaluateJavascript("if(window.onNativeSpeechError) window.onNativeSpeechError();", null);
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == 202 && resultCode == RESULT_OK && data != null) {
                      ArrayList<String> matches = data.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS);
                      if (matches != null && !matches.isEmpty()) {
                          String text = matches.get(0).replace("\\", "\\\\").replace("'", "\\'").replace("\n", " ");
                          webView.evaluateJavascript("if(window.onNativeSpeechResult) window.onNativeSpeechResult('" + text + "');", null);
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  webView.evaluateJavascript("window.closeAnyOpenModal ? window.closeAnyOpenModal() : false", value -> {
                      if (!"true".equals(value)) {
                          runOnUiThread(() -> MainActivity.super.onBackPressed());
                      }
                  });
              }

              @Override
              protected void onDestroy() {
                  if (tts != null) { tts.stop(); tts.shutdown(); }
                  if (speechRecognizer != null) { speechRecognizer.destroy(); }
                  super.onDestroy();
              }
          }
          EOF
          cd android-project
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-MARK-X-FINAL
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
