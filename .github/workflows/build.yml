name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/cli

      - name: Generate Package
        run: |
          mkdir -p output
          pwabuilder package --webManifest ./index.html --name "JARVIS" --packageId "com.stark.jarvis" --version "1.0.0" --dir ./output || echo "Done"

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: jarvis-apk
          path: output/
